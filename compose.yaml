services:
  dealership-platform:
    build:
      context: ./dealership-platform
    environment:
      NORTHSTAR_API_KEY: northstar-local-development
      NORTHSTAR_ADMIN_KEY: northstar-local-admin
      NORTHSTAR_DATA_PATH: /data/northstar.sqlite3
      NORTHSTAR_PORT: "4010"
    ports:
      - "4010:4010"
    volumes:
      - northstar-platform-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4010/health')",
        ]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 2s

  webchat-service:
    build:
      context: ./webchat-service
    environment:
      LLM_PROVIDER_URL: ${LLM_PROVIDER_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TURN_TIMEOUT_SECONDS: ${LLM_TURN_TIMEOUT_SECONDS:-45}
      MCP_SERVERS_JSON: ${MCP_SERVERS_JSON:-}
      NORTHSTAR_API_KEY: ${NORTHSTAR_API_KEY:-northstar-local-development}
      NORTHSTAR_BASE_URL: ${NORTHSTAR_BASE_URL:-http://dealership-platform:4010}
      WEBCHAT_DATABASE_PATH: ${WEBCHAT_DATABASE_PATH:-/data/webchat.sqlite3}
      WEBCHAT_COOKIE_SECURE: ${WEBCHAT_COOKIE_SECURE:-false}
      WEBCHAT_ALLOWED_ORIGIN: ${WEBCHAT_ALLOWED_ORIGIN:-http://localhost:4173}
      WEBCHAT_RETENTION_DAYS: ${WEBCHAT_RETENTION_DAYS:-30}
      WEBCHAT_REQUESTS_PER_MINUTE: ${WEBCHAT_REQUESTS_PER_MINUTE:-60}
      WEBCHAT_DAILY_TURN_LIMIT: ${WEBCHAT_DAILY_TURN_LIMIT:-0}
      WEBCHAT_MAX_CONCURRENT_TURNS: ${WEBCHAT_MAX_CONCURRENT_TURNS:-8}
      WEBCHAT_TRUST_PROXY_HEADERS: ${WEBCHAT_TRUST_PROXY_HEADERS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${WEBCHAT_PORT:-4020}:4020"
    volumes:
      - northstar-webchat-data:/data
    depends_on:
      dealership-platform:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4020/health/live')",
        ]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 3s

  dealership-website:
    build:
      context: ./dealership-website
    ports:
      - "4173:4173"
    depends_on:
      dealership-platform:
        condition: service_healthy
      webchat-service:
        condition: service_healthy

volumes:
  northstar-platform-data:
  northstar-webchat-data:
