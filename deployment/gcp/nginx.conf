events {}

http {
  map $http_cf_connecting_ip $reviewer_ip {
    default $http_cf_connecting_ip;
    "" $binary_remote_addr;
  }

  limit_req_zone $reviewer_ip zone=reviewer_turns:10m rate=12r/m;

  server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $reviewer_ip;
    proxy_set_header X-Forwarded-For $reviewer_ip;
    proxy_set_header X-Forwarded-Proto https;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /_health {
      access_log off;
      return 200 "ok\n";
    }

    location ~ ^/api/chat/v1/conversations/[^/]+/turns$ {
      limit_req zone=reviewer_turns burst=3 nodelay;
      limit_req_status 429;
      proxy_pass http://webchat-service:4020;
      proxy_read_timeout 70s;
    }

    location /api/chat/ {
      proxy_pass http://webchat-service:4020;
      proxy_read_timeout 70s;
    }

    location /widget/ {
      proxy_pass http://webchat-service:4020;
    }

    location /api/ {
      proxy_pass http://dealership-platform:4010;
    }

    location /assets/vehicles/ {
      proxy_pass http://dealership-platform:4010;
    }

    # Keep the dealership website image unchanged. Its development API base is
    # rewritten at the gateway so browsers use the public same-origin /api routes.
    location = /src/shared/api.js {
      proxy_set_header Accept-Encoding "";
      proxy_pass http://dealership-website:4173;
      sub_filter_types application/javascript text/javascript;
      sub_filter_once on;
      sub_filter 'const API_BASE_URL = "http://localhost:4010";'
        'const API_BASE_URL = window.location.origin;';
    }

    location / {
      # The unchanged website embeds the development widget URL. Rewriting it
      # here keeps the production integration entirely in deployment config.
      proxy_set_header Accept-Encoding "";
      proxy_pass http://dealership-website:4173;
      sub_filter_once off;
      sub_filter 'http://localhost:4020/widget/embed.js' '/widget/embed.js';
    }
  }
}
