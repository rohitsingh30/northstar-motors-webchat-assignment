<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="780" viewBox="0 0 2200 780" role="img" aria-labelledby="title desc">
  <title id="title">Northstar provider-first AI turn orchestration</title>
  <desc id="desc">Free text moves left to right through trusted context, the configured semantic provider, V2 domain-goal validation, semantic plan policy, deterministic goal conformance and transition routing, tools, trusted operations, presentation, and persistence. Business-information questions additionally pass through scoped fact answerability. Typed actions bypass semantic planning. Conversation-response recovery occurs only after the provider responds.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 30px Inter,Arial,sans-serif;fill:#0f172a}.subtitle{font:400 16px Inter,Arial,sans-serif;fill:#475569}
      .box{fill:#fff;stroke:#64748b;stroke-width:1.7;rx:14}.blue{fill:#dbeafe;stroke:#2563eb}.purple{fill:#ede9fe;stroke:#7c3aed}.teal{fill:#ccfbf1;stroke:#0f766e}.amber{fill:#fef3c7;stroke:#d97706}
      .label{font:700 15px Inter,Arial,sans-serif;fill:#0f172a;text-anchor:middle}.copy{font:400 13px Inter,Arial,sans-serif;fill:#334155;text-anchor:middle}
      .arrow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 6}.edge{font:600 12px Inter,Arial,sans-serif;fill:#475569;text-anchor:middle}
      .band{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:18}.band-title{font:700 13px Inter,Arial,sans-serif;fill:#475569;letter-spacing:.08em}
      .note{font:400 13px Inter,Arial,sans-serif;fill:#475569}.legend{font:400 13px Inter,Arial,sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="2200" height="720" fill="#ffffff"/>
  <text x="40" y="48" class="title">AI turn orchestration — provider first, deterministic execution</text>
  <text x="40" y="76" class="subtitle">Natural language reaches the configured provider first; application code validates and executes the resulting typed plan.</text>

  <rect x="28" y="110" width="2144" height="205" class="band"/>
  <text x="48" y="137" class="band-title">PRIMARY FREE-TEXT PATH</text>

  <rect x="40" y="160" width="180" height="105" class="box blue"/>
  <text x="130" y="193" class="label">User turn</text><text x="130" y="219" class="copy">text or typed action</text><text x="130" y="240" class="copy">plus page context</text>

  <rect x="260" y="160" width="190" height="105" class="box blue"/>
  <text x="355" y="193" class="label">Trusted context</text><text x="355" y="219" class="copy">history + workflow state</text><text x="355" y="240" class="copy">displayed entity IDs</text>

  <rect x="490" y="160" width="220" height="105" class="box purple"/>
  <text x="600" y="193" class="label">Semantic provider</text><text x="600" y="219" class="copy">Azure / OpenAI</text><text x="600" y="240" class="copy">or deterministic fake planner</text>

  <rect x="750" y="160" width="190" height="105" class="box purple"/>
  <text x="845" y="193" class="label">Typed V2 plan</text><text x="845" y="219" class="copy">one domain + goal</text><text x="845" y="240" class="copy">domain schema validated</text>

  <rect x="980" y="160" width="220" height="105" class="box teal"/>
  <text x="1090" y="193" class="label">SemanticPlanPolicy</text><text x="1090" y="219" class="copy">business goals pass through</text><text x="1090" y="240" class="copy">conversation prose is checked</text>

  <rect x="1240" y="160" width="210" height="105" class="box teal"/>
  <text x="1345" y="193" class="label">TransitionController</text><text x="1345" y="219" class="copy">goal conformance + references</text><text x="1345" y="240" class="copy">GoalKey → exact tool</text>

  <rect x="1490" y="160" width="180" height="105" class="box teal"/>
  <text x="1580" y="193" class="label">ToolRegistry</text><text x="1580" y="219" class="copy">strict inputs</text><text x="1580" y="240" class="copy">closed capabilities</text>

  <rect x="1710" y="160" width="210" height="105" class="box amber"/>
  <text x="1815" y="193" class="label">Trusted operation</text><text x="1815" y="219" class="copy">DealershipClient read</text><text x="1815" y="240" class="copy">or workflow preparation</text>

  <rect x="1960" y="160" width="200" height="105" class="box teal"/>
  <text x="2060" y="193" class="label">Present + persist</text><text x="2060" y="219" class="copy">safe text / closed view</text><text x="2060" y="240" class="copy">complete the turn</text>

  <path d="M220 212 H250" class="arrow"/><path d="M450 212 H480" class="arrow"/><text x="465" y="198" class="edge">free text</text>
  <path d="M710 212 H740" class="arrow"/><path d="M940 212 H970" class="arrow"/><path d="M1200 212 H1230" class="arrow"/>
  <path d="M1450 212 H1480" class="arrow"/><path d="M1670 212 H1700" class="arrow"/><path d="M1920 212 H1950" class="arrow"/>
  <text x="1935" y="198" class="edge">other results</text>

  <rect x="28" y="350" width="2144" height="300" class="band"/>
  <text x="48" y="378" class="band-title">CONTROLLED SIDE PATHS</text>

  <rect x="260" y="420" width="225" height="100" class="box blue"/>
  <text x="373" y="451" class="label">Structured action</text><text x="373" y="477" class="copy">trusted action type + IDs</text><text x="373" y="498" class="copy">no semantic interpretation</text>
  <path d="M355 265 V410" class="arrow"/><text x="400" y="338" class="edge">typed action</text>
  <path d="M485 490 V570 H1580 V275" class="arrow"/><text x="1030" y="558" class="edge">allow-listed tool transition</text>

  <rect x="970" y="420" width="250" height="110" class="box purple"/>
  <text x="1095" y="451" class="label">Prose safety recovery</text><text x="1095" y="477" class="copy">deterministic tool fallback</text><text x="1095" y="498" class="copy">one re-plan · safe clarification</text>
  <path d="M1090 265 V410" class="arrow"/><text x="1188" y="338" class="edge">only conversation.respond</text>
  <path d="M970 458 C845 385 690 360 600 275" class="arrow dashed"/><text x="785" y="365" class="edge">one re-plan</text>
  <path d="M1220 458 C1270 385 1320 340 1345 275" class="arrow"/><text x="1325" y="365" class="edge">typed fallback plan</text>
  <path d="M1095 530 V620 H2060 V275" class="arrow"/><text x="1650" y="608" class="edge">conversation or clarification</text>

  <rect x="1685" y="420" width="250" height="110" class="box teal"/>
  <text x="1810" y="451" class="label">Business fact resolver</text><text x="1810" y="477" class="copy">exact question + live facts</text><text x="1810" y="498" class="copy">matched or fail closed</text>
  <path d="M1815 265 V410" class="arrow"/><text x="1885" y="338" class="edge">business question</text>
  <path d="M1935 475 C2010 430 2060 360 2060 275" class="arrow"/><text x="2050" y="394" class="edge">scoped result</text>

  <text x="40" y="690" class="note">Limits: provider loop ≤ 4 iterations · conversation-response re-plan ≤ 1 · provider timeout 20 seconds · renderable ToolResult terminates.</text>
  <rect x="40" y="720" width="18" height="18" class="blue"/><text x="68" y="734" class="legend">request / trusted input</text>
  <rect x="280" y="720" width="18" height="18" class="purple"/><text x="308" y="734" class="legend">semantic planning / prose recovery</text>
  <rect x="600" y="720" width="18" height="18" class="teal"/><text x="628" y="734" class="legend">deterministic application execution</text>
  <rect x="950" y="720" width="18" height="18" class="amber"/><text x="978" y="734" class="legend">authoritative business dependency</text>
</svg>
