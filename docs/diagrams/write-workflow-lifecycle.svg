<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">Northstar webchat write workflow lifecycle</title>
  <desc id="desc">Ordinary write workflows validate and persist drafts before explicit confirmation. Private booking lookup uses a dedicated deterministic endpoint and short-lived grant before amend or cancel workflows.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .title{font:700 30px Inter,Arial,sans-serif;fill:#0f172a}.subtitle{font:400 15px Inter,Arial,sans-serif;fill:#475569}
      .lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:16}.lane-private{fill:#fff7ed;stroke:#f59e0b}.lane-title{font:700 16px Inter,Arial,sans-serif;fill:#334155}
      .box{fill:#fff;stroke:#64748b;stroke-width:1.5;rx:12}.blue{fill:#dbeafe;stroke:#2563eb}.teal{fill:#ccfbf1;stroke:#0f766e}.amber{fill:#fef3c7;stroke:#d97706}.green{fill:#dcfce7;stroke:#16a34a}.red{fill:#fee2e2;stroke:#dc2626}.purple{fill:#ede9fe;stroke:#7c3aed}
      .label{font:700 15px Inter,Arial,sans-serif;fill:#0f172a;text-anchor:middle}.copy{font:400 12.5px Inter,Arial,sans-serif;fill:#334155;text-anchor:middle}.small{font:500 11.5px Inter,Arial,sans-serif;fill:#475569;text-anchor:middle}
      .arrow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 6}.edge{font:600 12px Inter,Arial,sans-serif;fill:#475569;text-anchor:middle}.note{font:500 12px Inter,Arial,sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="1600" height="1020" fill="#fff"/>
  <text x="50" y="48" class="title">Write-workflow safety — drafts before effects</text>
  <text x="50" y="75" class="subtitle">The assistant can prepare customer requests; only an explicit application confirmation reaches a protected dealership mutation.</text>

  <rect x="40" y="110" width="980" height="825" class="lane"/><text x="60" y="143" class="lane-title">Standard create and confirmation workflow</text>
  <rect x="1060" y="110" width="500" height="825" class="lane lane-private"/><text x="1080" y="143" class="lane-title">Verified workshop management</text>

  <rect x="75" y="180" width="240" height="95" class="box blue"/>
  <text x="195" y="211" class="label">1 · Collect details</text><text x="195" y="237" class="copy">application form or validated</text><text x="195" y="258" class="copy">semantic fields</text>
  <rect x="390" y="180" width="240" height="95" class="box teal"/>
  <text x="510" y="211" class="label">2 · Prepare tool</text><text x="510" y="237" class="copy">prepare_* maps to one</text><text x="510" y="258" class="copy">supported workflow kind</text>
  <rect x="705" y="180" width="270" height="95" class="box teal"/>
  <text x="840" y="211" class="label">3 · Validate</text><text x="840" y="237" class="copy">required fields + normalization</text><text x="840" y="258" class="copy">safe customer summary</text>
  <path d="M315 227 L380 227" class="arrow"/><path d="M630 227 L695 227" class="arrow"/>

  <rect x="75" y="370" width="260" height="110" class="box amber"/>
  <text x="205" y="402" class="label">Collecting draft</text><text x="205" y="428" class="copy">missing fields persisted</text><text x="205" y="449" class="copy">details form returned</text><text x="205" y="470" class="small">new preparation replaces old active draft of same kind</text>
  <rect x="390" y="370" width="280" height="110" class="box purple"/>
  <text x="530" y="402" class="label">Awaiting confirmation</text><text x="530" y="428" class="copy">complete fields persisted</text><text x="530" y="449" class="copy">material SHA-256 hash</text><text x="530" y="470" class="small">draft expires after 24 hours</text>
  <path d="M800 275 C710 320 280 310 220 360" class="arrow"/><text x="490" y="315" class="edge">missing</text>
  <path d="M850 275 C790 320 640 330 565 360" class="arrow"/><text x="735" y="315" class="edge">complete</text>
  <path d="M205 370 C155 335 135 315 160 285" class="arrow dashed"/><text x="126" y="330" class="edge">edit</text>

  <rect x="390" y="560" width="280" height="105" class="box blue"/>
  <text x="530" y="591" class="label">4 · Explicit customer action</text><text x="530" y="617" class="copy">Confirm sends draftId</text><text x="530" y="638" class="copy">and clientActionId only</text>
  <rect x="75" y="560" width="260" height="105" class="box red"/>
  <text x="205" y="591" class="label">Cancel</text><text x="205" y="617" class="copy">draft becomes cancelled</text><text x="205" y="638" class="copy">no dealership write</text>
  <path d="M470 480 L500 550" class="arrow"/><path d="M450 480 C390 515 300 530 250 550" class="arrow"/>

  <rect x="390" y="745" width="280" height="125" class="box amber"/>
  <text x="530" y="776" class="label">5 · Atomic attempt</text><text x="530" y="802" class="copy">draft → executing</text><text x="530" y="823" class="copy">persist attempt + clientActionId</text><text x="530" y="844" class="copy">persist idempotency key before call</text>
  <rect x="735" y="745" width="240" height="125" class="box teal"/>
  <text x="855" y="776" class="label">6 · Protected operation</text><text x="855" y="802" class="copy">DealershipClient adds API key</text><text x="855" y="823" class="copy">creation sends same idempotency key</text><text x="855" y="844" class="copy">platform decides outcome</text>
  <path d="M530 665 L530 735" class="arrow"/><path d="M670 808 L725 808" class="arrow"/>

  <rect x="75" y="745" width="260" height="125" class="box green"/>
  <text x="205" y="776" class="label">7 · Receipt and restore</text><text x="205" y="802" class="copy">public receipt persisted</text><text x="205" y="823" class="copy">draft card replaced</text><text x="205" y="844" class="copy">restoration inserts missing receipts</text>
  <path d="M735 850 C630 910 355 910 270 880" class="arrow"/><text x="520" y="910" class="edge">success</text>
  <path d="M855 745 C850 680 725 630 680 635" class="arrow dashed"/><text x="780" y="675" class="edge">retryable error → awaiting confirmation</text>

  <rect x="1100" y="180" width="420" height="100" class="box blue"/>
  <text x="1310" y="211" class="label">A · Private lookup form</text><text x="1310" y="237" class="copy">reference + surname + registration + phone</text><text x="1310" y="258" class="copy">submitted outside the chat turn endpoint</text>
  <rect x="1100" y="355" width="420" height="115" class="box teal"/>
  <text x="1310" y="387" class="label">B · Deterministic lookup endpoint</text><text x="1310" y="413" class="copy">proof sent directly to DealershipClient</text><text x="1310" y="434" class="copy">not added to transcript, model, draft, log,</text><text x="1310" y="455" class="copy">or saved form profile</text>
  <rect x="1100" y="550" width="420" height="115" class="box amber"/>
  <text x="1310" y="582" class="label">C · Verified booking grant</text><text x="1310" y="608" class="copy">server-side booking ID + safe snapshot</text><text x="1310" y="629" class="copy">conversation scoped · expires in 30 minutes</text><text x="1310" y="650" class="copy">revoked after amend or cancel</text>
  <rect x="1100" y="745" width="420" height="125" class="box purple"/>
  <text x="1310" y="776" class="label">D · Amend or cancel draft</text><text x="1310" y="802" class="copy">grant ID injected server-side</text><text x="1310" y="823" class="copy">customer reviews a safe summary</text><text x="1310" y="844" class="copy">then joins the standard confirmation path</text>
  <path d="M1310 280 L1310 345" class="arrow"/><path d="M1310 470 L1310 540" class="arrow"/><path d="M1310 665 L1310 735" class="arrow"/>
  <path d="M1100 807 C940 700 760 600 680 610" class="arrow dashed"/><text x="935" y="702" class="edge">confirmation path</text>

  <text x="50" y="972" class="note">Persistence today: workflow contact fields remain in the server-side draft for execution and are not echoed in confirmation messages; separate early cleanup is not implemented.</text>
  <text x="50" y="994" class="note">Current limitation: amendment/cancellation calls are deduplicated locally by clientActionId, but ambiguous upstream outcomes are not yet reconciled with an automatic follow-up read.</text>
</svg>
